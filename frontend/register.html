<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration | CareConnect Hospital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon-wrapper">
          <i class="fa-solid fa-heart-pulse"></i>
        </div>
        <div>Care<span class="highlight">Connect</span></div>
      </a>

      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="doctors.html">Find Doctor</a></li>
        <li><a href="index.html#departments">Departments</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline-dark btn-sm">Login</a>
      </div>

      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle navigation">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <main class="auth-page">
    <div class="container">
      <div class="auth-card" style="max-width: 600px;">
        
        <div class="auth-header">
          <div class="brand-icon-wrapper" style="margin: 0 auto 16px; width: 48px; height: 48px; font-size: 1.3rem;">
            <i class="fa-solid fa-user-plus"></i>
          </div>
          <h2>Patient Registration</h2>
          <p>Create your CareConnect account to schedule appointments and view medical records.</p>
        </div>

        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="name">Full Name *</label>
            <input type="text" id="name" class="form-control" placeholder="Rohan Sharma" required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label class="form-label" for="email">Email Address *</label>
              <input type="email" id="email" class="form-control" placeholder="rohan@example.com" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="phone">Mobile Number *</label>
              <input type="tel" id="phone" class="form-control" placeholder="+91 98220 12345" required>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label class="form-label" for="date_of_birth">Date of Birth</label>
              <input type="date" id="date_of_birth" class="form-control">
            </div>

            <div class="form-group">
              <label class="form-label" for="gender">Gender</label>
              <select id="gender" class="form-select">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="address">Residential Address</label>
            <input type="text" id="address" class="form-control" placeholder="Flat / House No, Street, City, Pincode">
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label class="form-label" for="password">Password (min 6 characters) *</label>
              <input type="password" id="password" class="form-control" placeholder="Choose a password" required minlength="6">
            </div>

            <div class="form-group">
              <label class="form-label" for="confirmPassword">Confirm Password *</label>
              <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required minlength="6">
            </div>
          </div>

          <button type="submit" id="register-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
            <i class="fa-solid fa-user-plus"></i> Create Account
          </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
          Already have an account? <a href="login.html" style="font-weight: 700;">Sign in here</a>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding-top: 0;">
        <div>&copy; 2026 CareConnect Hospital &bull; "Your Health, Our Priority"</div>
        <div><a href="index.html" style="color: #94a3b8;">Home</a></div>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
